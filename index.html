<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#15263e"><link rel="manifest" href="/manifest.webmanifest"><title>Mes tâches</title>
<style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#1b2b42;background:#f3f6fb}*{box-sizing:border-box}body{margin:0}.wrap{max-width:850px;margin:auto;padding:22px 15px}header{background:#15263e;color:white;padding:23px 0}header h1{margin:0;font-size:27px}header p{margin:6px 0 0;color:#c6d4e7}.panel{background:white;border-radius:16px;padding:18px;margin:18px 0;box-shadow:0 3px 20px #172a4210}form{display:grid;grid-template-columns:1fr 1fr;gap:10px}input,select,textarea,button{font:inherit;border-radius:9px;padding:11px;border:1px solid #cbd5e1}input[name=title],textarea{grid-column:1/-1}button{cursor:pointer;background:#2364d2;color:white;border:0;font-weight:600}button.secondary{background:#e9eef7;color:#233955}button.danger{background:#fff0f0;color:#a12c2c}.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.toolbar>*{flex:1;min-width:120px}.task{display:flex;gap:12px;align-items:flex-start;border-bottom:1px solid #e7edf4;padding:15px 0}.task:last-child{border:0}.task input{margin-top:5px;accent-color:#2364d2}.detail{flex:1;min-width:0}.detail strong{overflow-wrap:anywhere}.meta{color:#63748c;font-size:13px;margin-top:6px}.notes{white-space:pre-wrap;color:#42526b;font-size:14px}.done strong{text-decoration:line-through;color:#8492a6}.actions{display:flex;gap:6px}.actions button{padding:7px 9px;font-size:12px}.count{font-size:14px;color:#5d6c80}#message{min-height:20px;color:#9a3434}dialog{border:0;border-radius:16px;max-width:530px;width:calc(100% - 25px);box-shadow:0 10px 80px #15263e60}dialog::backdrop{background:#17233b88}dialog form{display:grid}footer{font-size:12px;color:#6c7b90;margin:30px 0}@media(max-width:520px){.task{gap:8px}.actions{flex-direction:column}form{grid-template-columns:1fr}input,select,textarea{grid-column:1/-1}}
</style></head><body><header><div class="wrap"><h1>✓ Mes tâches</h1><p>Travail · Maison · Personnel — synchronisées avec votre serveur</p></div></header><main class="wrap">
<section class="panel"><h2>Ajouter une tâche</h2><form id="add"><input name="title" placeholder="Ex. Appeler le constructeur" maxlength="180" required><select name="category"><option>Travail</option><option>Maison</option><option>Personnel</option><option>Autre</option></select><select name="priority"><option>Normale</option><option>Haute</option><option>Urgente</option></select><label>Échéance <input name="due" type="date"></label><textarea name="notes" placeholder="Notes facultatives" rows="2"></textarea><button>+ Ajouter la tâche</button></form></section>
<section class="panel"><div class="toolbar"><select id="filter"><option value="all">Toutes les tâches</option><option value="todo">À faire</option><option value="done">Terminées</option></select><select id="cat"><option value="all">Toutes catégories</option><option>Travail</option><option>Maison</option><option>Personnel</option><option>Autre</option></select><input id="search" placeholder="Rechercher…"><button id="export" class="secondary">Exporter JSON</button></div><p class="count" id="count"></p><div id="tasks"></div></section><p id="message" role="alert"></p><footer>Les tâches sont stockées dans une base SQLite sur votre serveur. Faites des sauvegardes régulières. Les données de démonstration ne sont pas préremplies.</footer></main>
<dialog id="editDialog"><h2>Modifier la tâche</h2><form id="edit"><input type="hidden" name="id"><input name="title" required maxlength="180"><select name="category"><option>Travail</option><option>Maison</option><option>Personnel</option><option>Autre</option></select><select name="priority"><option>Normale</option><option>Haute</option><option>Urgente</option></select><label>Échéance <input name="due" type="date"></label><textarea name="notes" rows="3"></textarea><button>Enregistrer</button><button type="button" class="secondary" id="cancel">Annuler</button></form></dialog>
<script>
let token=sessionStorage.getItem('task_token')||'',tasks=[];
async function api(url,method='GET',body){if(!token){token=prompt('Mot de passe API de votre application :')||'';sessionStorage.setItem('task_token',token)}const r=await fetch('/api'+url,{method,headers:{Authorization:'Bearer '+token,...(body?{'Content-Type':'application/json'}:{})},body:body?JSON.stringify(body):undefined});if(r.status===401){sessionStorage.removeItem('task_token');token='';throw Error('Accès refusé : rechargez et vérifiez votre jeton API.')}if(!r.ok)throw Error('Erreur '+r.status);return r.status===204?null:r.json()}
const msg=e=>document.getElementById('message').textContent=e.message||String(e);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function load(){tasks=await api('/tasks');render()}
function render(){const f=document.getElementById('filter').value,c=document.getElementById('cat').value,q=document.getElementById('search').value.toLowerCase();let rows=tasks.filter(t=>(f==='all'||(f==='done')===t.done)&&(c==='all'||t.category===c)&&(t.title+' '+t.notes).toLowerCase().includes(q));document.getElementById('count').textContent=`${tasks.filter(t=>!t.done).length} à faire · ${tasks.filter(t=>t.done).length} terminées`;document.getElementById('tasks').innerHTML=rows.length?rows.map(t=>`<div class="task ${t.done?'done':''}"><input aria-label="Terminer" type="checkbox" data-action="toggle" data-id="${esc(t.id)}" ${t.done?'checked':''}><div class="detail"><strong>${esc(t.title)}</strong><div class="meta">${esc(t.category)} · ${esc(t.priority)}${t.due?' · 📅 '+esc(t.due):''}</div>${t.notes?'<p class="notes">'+esc(t.notes)+'</p>':''}</div><div class="actions"><button class="secondary" data-action="edit" data-id="${esc(t.id)}">Modifier</button><button class="danger" data-action="delete" data-id="${esc(t.id)}">Supprimer</button></div></div>`).join(''):'<p>Aucune tâche dans cette sélection.</p>'}
const values=form=>Object.fromEntries(new FormData(form));
document.getElementById('add').onsubmit=async e=>{e.preventDefault();try{await api('/tasks','POST',values(e.target));e.target.reset();await load()}catch(err){msg(err)}};
document.getElementById('tasks').addEventListener('click',async e=>{const b=e.target.closest('button[data-action]');if(!b)return;const t=tasks.find(x=>x.id===b.dataset.id);if(!t)return;if(b.dataset.action==='edit'){for(const [k,v] of Object.entries(t)){const el=document.querySelector('#edit [name="'+k+'"]');if(el)el.value=v}document.getElementById('editDialog').showModal()}if(b.dataset.action==='delete'&&confirm('Supprimer cette tâche ?'))try{await api('/tasks/'+t.id,'DELETE');await load()}catch(err){msg(err)}});
document.getElementById('tasks').addEventListener('change',async e=>{if(e.target.dataset.action==='toggle')try{await api('/tasks/'+e.target.dataset.id,'PATCH',{done:e.target.checked});await load()}catch(err){msg(err)}});
document.getElementById('edit').onsubmit=async e=>{e.preventDefault();const x=values(e.target);try{await api('/tasks/'+x.id,'PATCH',x);document.getElementById('editDialog').close();await load()}catch(err){msg(err)}};
document.getElementById('cancel').onclick=()=>document.getElementById('editDialog').close();
['filter','cat','search'].forEach(id=>document.getElementById(id).addEventListener('input',render));
document.getElementById('export').onclick=async()=>{try{const data=await api('/export');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));a.download='mes-taches-sauvegarde.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}catch(err){msg(err)}};
load().catch(msg);if('serviceWorker'in navigator)navigator.serviceWorker.register('/sw.js').catch(()=>{});
</script></body></html>
